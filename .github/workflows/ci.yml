name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  e2e:
    name: Playwright browser flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  reproducible:
    name: models and vendored files are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: python tools/convert_legacy_models.py
      - name: Regenerating must leave the tree identical
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: npm ci
      - run: npm audit

  docker:
    name: docker build + container browser flow
    runs-on: ubuntu-latest
    env:
      HOST_PORT: "8888"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and start (waits for the healthcheck)
        run: docker compose up -d --build --wait
      - name: Container runs as non-root with a read-only filesystem
        run: |
          test "$(docker compose exec -T viewer id -u)" != "0"
          ! docker compose exec -T viewer sh -c 'touch /app/x'
      - name: Assets are served compressed
        run: |
          for p in /models/elephant.glb /static/vendor/three/build/three.core.js; do
            curl -s -D- -o /dev/null -H 'Accept-Encoding: gzip' "http://localhost:8888$p" | grep -i 'content-encoding: gzip'
          done
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright against the container
        run: E2E_NO_SERVER=1 E2E_PORT=8888 npx playwright test
      - name: Container logs
        if: failure()
        run: docker compose logs
      - run: docker compose down
      - name: HSTS is off by default and opt-in via env (documented in the README)
        run: |
          hdrs() { curl -s -D- -o /dev/null http://localhost:8888/main; }
          docker compose up -d --wait
          ! hdrs | grep -i strict-transport-security
          docker compose down
          HSTS_SECONDS=3600 docker compose up -d --wait
          hdrs | grep -ix 'Strict-Transport-Security: max-age=3600.*' | grep -vi includesubdomains
          docker compose down
          HSTS_SECONDS=3600 HSTS_INCLUDE_SUBDOMAINS=1 SECURE_COOKIES=1 docker compose up -d --wait
          hdrs | grep -i 'strict-transport-security: max-age=3600; includeSubDomains'
          hdrs | grep -i 'set-cookie: _xsrf=.*Secure'
          docker compose down
